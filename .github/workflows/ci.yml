name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema
      - name: Validate state against JSON Schemas
        run: |
          check-jsonschema --schemafile state/schema/workspace.schema.json state/workspace.yaml
          check-jsonschema --schemafile state/schema/tasks.schema.json state/tasks.yaml
          shopt -s nullglob
          for f in state/ledger/*.jsonl; do
            python - "$f" <<'PY'
          import json, sys
          for i, line in enumerate(open(sys.argv[1]), 1):
              if line.strip():
                  json.loads(line)
          PY
          done

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
