name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: minbit validate (references, dependency cycles)
        run: cargo run -q -- validate

  state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema
      - name: Validate state against JSON Schemas
        run: |
          check-jsonschema --schemafile state/schema/workspace.schema.json state/workspace.yaml
          check-jsonschema --schemafile state/schema/tasks.schema.json state/tasks.yaml
          # Ledger: one JSON object per line, each checked against the entry schema.
          # Split into one file per line so check-jsonschema can validate them.
          shopt -s nullglob
          out="$RUNNER_TEMP/ledger"
          mkdir -p "$out"
          for f in state/ledger/*.jsonl; do
            python3 - "$f" "$out" <<'PY'
          import json, os, sys
          src, out = sys.argv[1], sys.argv[2]
          base = os.path.basename(src)
          for i, line in enumerate(open(src, encoding="utf-8"), 1):
              if line.strip():
                  try:
                      obj = json.loads(line)
                  except json.JSONDecodeError as e:
                      sys.exit(f"{src}:{i}: invalid JSON: {e}")
                  with open(os.path.join(out, f"{base}.line{i:05d}.json"), "w") as w:
                      json.dump(obj, w)
          PY
          done
          entries=("$out"/*.json)
          if [ ${#entries[@]} -gt 0 ]; then
            check-jsonschema --schemafile state/schema/ledger-entry.schema.json "${entries[@]}"
          fi

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
