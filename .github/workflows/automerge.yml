name: automerge

# Enables GitHub auto-merge (squash) on agent PRs that carry no needs-human:* label.
# GitHub then merges only after branch protection is satisfied (required checks + review).
# Requires the ruleset in .github/rulesets/main.json (MB-004).

on:
  pull_request_target:
    types: [opened, labeled, unlabeled, synchronize, ready_for_review]

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  decide:
    # Only same-repo agent branches; fork PRs never get auto-merge.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'agent/') && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Enable or disable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if ! LABELS=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name'); then
            echo "::error::Could not fetch current PR labels; disabling existing auto-merge"
            gh pr merge "$PR" --repo "$REPO" --disable-auto || true
            exit 1
          fi
          # Escalations revoke auto-merge independently of ruleset availability.
          if echo "$LABELS" | grep -q 'needs-human:'; then
            echo "Escalation label present: disabling auto-merge"
            gh pr merge "$PR" --repo "$REPO" --disable-auto || true
            exit 0
          fi

          # Safety: without required checks on main, `--auto` merges immediately (PR #13).
          # Refuse to enable auto-merge unless the default branch has a required-status-checks rule.
          if ! RULES=$(gh api "repos/$REPO/rules/branches/main" --jq '[.[] | select(.type=="required_status_checks")] | length'); then
            echo "::error::Could not verify required status checks on main; disabling existing auto-merge"
            gh pr merge "$PR" --repo "$REPO" --disable-auto || true
            exit 1
          fi
          if [ "${RULES:-0}" -eq 0 ]; then
            echo "::error::main has no required status checks (see .github/rulesets/main.json); not enabling auto-merge"
            gh pr merge "$PR" --repo "$REPO" --disable-auto || true
            exit 1
          fi
          gh pr merge "$PR" --repo "$REPO" --auto --squash
