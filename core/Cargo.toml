[package]
name = "minbit"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "MinBit Workspace core: world-model state, task selection, run lifecycle and run ledger"
repository = "https://github.com/MinBitOrg/minbit"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
